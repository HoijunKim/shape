name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  # The CLI: goreleaser builds the cgo-free `shape` binary for every
  # OS/arch, publishes the GitHub Release for this tag, and pushes the
  # Homebrew cask. This job MUST run first -- the gui job uploads its
  # desktop-app assets onto the Release this creates.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The desktop app: goreleaser cannot build the Wails GUI (it needs a
  # native toolchain + webview per OS), so build it here on each OS and
  # attach the packaged app to the same Release. This is the artifact a
  # non-Go user actually downloads and runs.
  gui:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Wails' Linux build needs GTK3 + WebKit2GTK dev headers. 22.04
      # ships webkit2gtk-4.0, which the default Wails build targets (24.04
      # dropped it for 4.1, which would need an extra build tag).
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # macOS ships a universal (arm64 + amd64) binary; Windows and Linux
      # build for the host amd64 runner. `wails build` runs the frontend
      # install/build and regenerates bindings itself.
      - name: Build the desktop app (macOS universal)
        if: runner.os == 'macOS'
        working-directory: gui
        run: wails build -platform darwin/universal -clean
      - name: Build the desktop app
        if: runner.os != 'macOS'
        working-directory: gui
        run: wails build -clean

      # Package + upload per OS, in the same shell, so each runner touches
      # only the one artifact it produced (no cross-shell glob juggling).
      - name: Package + upload (Windows)
        if: runner.os == 'Windows'
        working-directory: gui
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = "shape-gui_${{ github.ref_name }}_windows_amd64.zip"
          Compress-Archive -Path build/bin/shape-gui.exe -DestinationPath $asset -Force
          gh release upload "${{ github.ref_name }}" $asset --clobber

      - name: Package + upload (macOS)
        if: runner.os == 'macOS'
        working-directory: gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="shape-gui_${{ github.ref_name }}_darwin_universal.zip"
          ditto -c -k --keepParent build/bin/shape-gui.app "$asset"
          gh release upload "${{ github.ref_name }}" "$asset" --clobber

      - name: Package + upload (Linux)
        if: runner.os == 'Linux'
        working-directory: gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="shape-gui_${{ github.ref_name }}_linux_amd64.tar.gz"
          tar -C build/bin -czf "$asset" shape-gui
          gh release upload "${{ github.ref_name }}" "$asset" --clobber
